name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch supersedes an in-flight run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # postinstall downloads the Electron binary; caching it saves ~100MB of
      # download per run. Keyed on the Electron version in the lockfile.
      - name: Cache Electron binary
        uses: actions/cache@v4
        with:
          path: ~/.cache/electron
          key: electron-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      # Also rebuilds better-sqlite3 against Electron's ABI (electron-builder
      # install-app-deps, from postinstall), which the integration suite needs.
      - name: Install dependencies
        run: npm ci

      # The verification gate for the app itself: compiles main, preload and
      # renderer. Note there is deliberately no `tsc -b` step — the source does
      # not pass a standalone tsc even on main (third-party typing and
      # target/lib mismatches that esbuild transpiles past), so it would fail
      # every run. See CLAUDE.md.
      - name: Build
        run: npm run build

      # Renderer-store checks: plain node, no Docker or Electron needed, so they
      # run before the slow suite and fail fast.
      - name: Store tests
        run: npm run test:store

      # Starts GreenMail in Docker (preinstalled on ubuntu-latest) and runs the
      # suite in a windowless Electron main process. No xvfb needed: the runner
      # switches to headless Ozone when there is no DISPLAY.
      # On failure the runner prints GreenMail's log before tearing the
      # container down, so there is no separate log-collection step here.
      - name: Integration tests
        run: npm run test:imap

  # The macOS target has one job here: prove it still installs and builds.
  #
  # The reason it is a separate job rather than a matrix leg is that the two
  # platforms can run different amounts of the suite. `test:imap` needs Docker
  # for GreenMail, and the macOS runners have no Docker daemon, so the
  # integration suite stays Linux-only and this leg stops at the build gate plus
  # the store tests.
  #
  # What it catches is worth a job on its own: `postinstall` resolves the
  # Electron binary path per platform, and the Linux-only version of that script
  # failed `npm install` outright on macOS. That is invisible to every check
  # that runs on ubuntu.
  build-macos:
    runs-on: macos-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Cache Electron binary
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/electron
          key: electron-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      # Also rebuilds better-sqlite3 against Electron's ABI, and runs the
      # platform-aware Electron install script — the step that used to fail here.
      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Store tests
        run: npm run test:store
